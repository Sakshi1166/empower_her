services:
  - type: web
    name: empowerher
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: JPA_DDL_AUTO
        value: update
      - key: THYMELEAF_CACHE
        value: "true"
      - key: DEVTOOLS_RESTART_ENABLED
        value: "false"
      - key: DEVTOOLS_LIVERELOAD_ENABLED
        value: "false"
      - key: BOOTSTRAP_CREATE_DEFAULT_USERS
        value: "false"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
