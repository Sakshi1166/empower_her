<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schemes - EmpowerHer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .scheme-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            border-radius: 15px;
            overflow: hidden;
        }
        .scheme-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .scheme-image {
            height: 200px;
            object-fit: cover;
            width: 100%;
        }
        .category-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .level-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.7rem;
        }
        .search-box {
            border-radius: 25px;
            border: 2px solid #e9ecef;
            padding: 10px 20px;
        }
        .filter-btn {
            border-radius: 20px;
            margin: 5px;
        }
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-hands-helping"></i> EmpowerHer
            </a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="bg-primary text-white py-5">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-8">
                    <h1 class="display-4 fw-bold">Women Empowerment Schemes</h1>
                    <p class="lead">Discover government and private schemes designed to empower women across different sectors</p>
                </div>
                <div class="col-lg-4 text-center">
                    <img src="https://cdn.pixabay.com/photo/2018/01/18/17/09/women-3090844_1280.png" 
                         alt="Women Empowerment" class="img-fluid" style="max-height: 200px;">
                </div>
            </div>
        </div>
    </section>

    <!-- Search and Filters -->
    <section class="py-4 bg-light">
        <div class="container">
            <div class="row">
                <div class="col-md-8">
                    <div class="input-group">
                        <input type="text" id="searchInput" class="form-control search-box" 
                               placeholder="Search schemes by name, description...">
                        <button class="btn btn-primary" onclick="searchSchemes()">
                            <i class="fas fa-search"></i> Search
                        </button>
                    </div>
                </div>
                <div class="col-md-4">
                    <select id="categoryFilter" class="form-select" onchange="filterSchemes()">
                        <option value="">All Categories</option>
                    </select>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-12">
                    <div class="btn-group">
                        <button class="btn btn-outline-primary filter-btn" onclick="filterByLevel('')">All</button>
                        <button class="btn btn-outline-primary filter-btn" onclick="filterByLevel('CENTRAL')">Central</button>
                        <button class="btn btn-outline-primary filter-btn" onclick="filterByLevel('STATE')">State</button>
                        <button class="btn btn-outline-primary filter-btn" onclick="filterByLevel('DISTRICT')">District</button>
                        <button class="btn btn-outline-primary filter-btn" onclick="filterByLevel('PRIVATE')">Private</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Stats Section -->
    <section class="py-4">
        <div class="container">
            <div class="row" id="statsContainer">
                <!-- Stats will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Schemes Grid -->
    <section class="py-5">
        <div class="container">
            <div class="row" id="schemesContainer">
                <!-- Schemes will be loaded dynamically -->
            </div>
            <div class="text-center mt-4" id="loadingSpinner">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            <div class="text-center mt-4" id="noSchemes" style="display: none;">
                <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                <h4 class="text-muted">No schemes found</h4>
                <p class="text-muted">Try adjusting your search or filters</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2024 EmpowerHer. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const API_BASE = '/api/schemes';
        let allSchemes = [];
        let currentCategory = '';
        let currentLevel = '';

        // Load schemes on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadSchemes();
            loadCategories();
        });

        async function loadSchemes() {
            showLoading(true);
            try {
                const response = await axios.get(API_BASE);
                allSchemes = response.data;
                displaySchemes(allSchemes);
                updateStats(allSchemes);
            } catch (error) {
                console.error('Error loading schemes:', error);
                showError();
            }
            showLoading(false);
        }

        function displaySchemes(schemes) {
            const container = document.getElementById('schemesContainer');
            
            if (schemes.length === 0) {
                document.getElementById('noSchemes').style.display = 'block';
                container.innerHTML = '';
                return;
            }
            
            document.getElementById('noSchemes').style.display = 'none';
            
            container.innerHTML = schemes.map(scheme => `
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="card scheme-card h-100">
                        <div class="position-relative">
                            ${scheme.imageUrl ? 
                                `<img src="${scheme.imageUrl}" class="card-img-top scheme-image" alt="${scheme.title}">` :
                                `<img src="https://cdn.pixabay.com/photo/2017/08/06/22/09/woman-2593366_1280.jpg" class="card-img-top scheme-image" alt="Default scheme image">`
                            }
                            <span class="category-badge">${scheme.category.name}</span>
                            <span class="level-badge">${scheme.level}</span>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${scheme.title}</h5>
                            <p class="card-text flex-grow-1">${scheme.shortDesc}</p>
                            <div class="mt-auto">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <small class="text-muted">
                                        <i class="fas fa-share-alt"></i> ${scheme.shareCount} shares
                                    </small>
                                    <small class="text-muted">
                                        <i class="far fa-clock"></i> ${new Date(scheme.createdAt).toLocaleDateString()}
                                    </small>
                                </div>
                                <div class="d-grid gap-2">
                                    <a href="scheme-details.html?id=${scheme.id}" class="btn btn-primary">
                                        <i class="fas fa-info-circle"></i> View Details
                                    </a>
                                    ${scheme.applyLink ? 
                                        `<a href="${scheme.applyLink}" target="_blank" class="btn btn-outline-success">
                                            <i class="fas fa-paper-plane"></i> Apply Now
                                        </a>` : ''
                                    }
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateStats(schemes) {
            const stats = {
                total: schemes.length,
                central: schemes.filter(s => s.level === 'CENTRAL').length,
                state: schemes.filter(s => s.level === 'STATE').length,
                district: schemes.filter(s => s.level === 'DISTRICT').length,
                private: schemes.filter(s => s.level === 'PRIVATE').length
            };

            document.getElementById('statsContainer').innerHTML = `
                <div class="col-md-2 col-6 mb-3">
                    <div class="stats-card text-center">
                        <h3>${stats.total}</h3>
                        <p>Total Schemes</p>
                    </div>
                </div>
                <div class="col-md-2 col-6 mb-3">
                    <div class="stats-card text-center" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                        <h3>${stats.central}</h3>
                        <p>Central</p>
                    </div>
                </div>
                <div class="col-md-2 col-6 mb-3">
                    <div class="stats-card text-center" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                        <h3>${stats.state}</h3>
                        <p>State</p>
                    </div>
                </div>
                <div class="col-md-2 col-6 mb-3">
                    <div class="stats-card text-center" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
                        <h3>${stats.district}</h3>
                        <p>District</p>
                    </div>
                </div>
                <div class="col-md-2 col-6 mb-3">
                    <div class="stats-card text-center" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">
                        <h3>${stats.private}</h3>
                        <p>Private</p>
                    </div>
                </div>
                <div class="col-md-2 col-6 mb-3">
                    <div class="stats-card text-center" style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); color: #333;">
                        <h3>${schemes.reduce((acc, curr) => acc + curr.shareCount, 0)}</h3>
                        <p>Total Shares</p>
                    </div>
                </div>
            `;
        }

        async function loadCategories() {
            try {
                // You might need to create a categories API endpoint
                const response = await axios.get('/api/categories');
                const categories = response.data;
                const select = document.getElementById('categoryFilter');
                select.innerHTML = '<option value="">All Categories</option>' +
                    categories.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        function searchSchemes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allSchemes;

            if (query) {
                filtered = allSchemes.filter(scheme => 
                    scheme.title.toLowerCase().includes(query) ||
                    scheme.shortDesc.toLowerCase().includes(query) ||
                    scheme.fullDesc.toLowerCase().includes(query)
                );
            }

            if (currentCategory) {
                filtered = filtered.filter(scheme => scheme.category.id == currentCategory);
            }

            if (currentLevel) {
                filtered = filtered.filter(scheme => scheme.level === currentLevel);
            }

            displaySchemes(filtered);
            updateStats(filtered);
        }

        function filterSchemes() {
            currentCategory = document.getElementById('categoryFilter').value;
            searchSchemes();
        }

        function filterByLevel(level) {
            currentLevel = level;
            searchSchemes();
        }

        function showLoading(show) {
            document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
        }

        function showError() {
            const container = document.getElementById('schemesContainer');
            container.innerHTML = `
                <div class="col-12 text-center">
                    <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                    <h4 class="text-warning">Error Loading Schemes</h4>
                    <p>Please try refreshing the page</p>
                    <button class="btn btn-primary" onclick="loadSchemes()">
                        <i class="fas fa-redo"></i> Retry
                    </button>
                </div>
            `;
        }
    </script>
</body>
</html>
