<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EmpowerHer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #E75480;
            --secondary-color: #6A1E55;
            --accent-color: #F5B841;
            --light-bg: #FFF4F6;
            --dark-text: #2B2B2B;
        }

        .login-container {
            min-height: 100vh;
            background: var(--light-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-card {
            background: white;
            border-radius: 25px;
            border: 1px solid rgba(231, 84, 128, 0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
            border-left: 6px solid var(--primary-color);
        }
        
        .login-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .login-body {
            padding: 40px 30px 30px;
        }
        
        .form-control-enhanced {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px 20px;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        
        .form-control-enhanced:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(231, 84, 128, 0.1);
            transform: translateY(-2px);
        }
        
        .btn-login {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 25px;
            padding: 15px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            width: 100%;
            color: white;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(231, 84, 128, 0.3);
        }
        
        .demo-card {
            background: var(--light-bg);
            border-radius: 15px;
            border: 2px dashed var(--primary-color);
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <div class="mb-3">
                    <img th:src="@{/images/logo.png}" alt="EmpowerHer Logo" height="60">
                </div>
                <h2 class="fw-bold mb-2">Welcome Back</h2>
                <p class="mb-0 opacity-75">Sign in to your EmpowerHer account</p>
            </div>

            <!-- Body -->
            <div class="login-body">
                <!-- Success Messages -->
                <div th:if="${param.logout != null}" class="alert alert-success alert-dismissible fade show rounded-3 mb-4">
                    <i class="fas fa-check-circle me-2"></i>
                    <strong>Success!</strong> You have been logged out successfully.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${param.registered != null}" class="alert alert-success alert-dismissible fade show rounded-3 mb-4">
                    <i class="fas fa-check-circle me-2"></i>
                    <strong>Success!</strong> Registration successful! Please login with your credentials.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Error Messages -->
                <div th:if="${param.error != null}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <strong>Login Failed!</strong> Invalid username or password.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Login Form -->
                <form th:action="@{/login}" method="post" id="loginForm">
                    <div class="mb-4">
                        <label for="username" class="form-label fw-semibold">
                            <i class="fas fa-user me-2" style="color: var(--primary-color);"></i>Username
                        </label>
                        <input type="text" class="form-control-enhanced" id="username" name="username" 
                               placeholder="Enter your username" required autofocus>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">
                            <i class="fas fa-lock me-2" style="color: var(--primary-color);"></i>Password
                        </label>
                        <input type="password" class="form-control-enhanced" id="password" name="password" 
                               placeholder="Enter your password" required>
                    </div>
                    
                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-login">
                            <i class="fas fa-sign-in-alt me-2"></i> Sign In
                        </button>
                    </div>
                </form>
                
                <div class="text-center mb-4">
                    <p class="text-muted">Don't have an account? 
                        <a th:href="@{/register}" class="text-decoration-none fw-bold" style="color: var(--primary-color);">Create one here</a>
                    </p>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Signing In...';
            submitBtn.disabled = true;
            
            setTimeout(() => {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }, 5000);
        });
    </script>
</body>
</html>
