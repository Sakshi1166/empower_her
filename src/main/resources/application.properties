spring.application.name=empowerher

server.port=${PORT:8081}
server.servlet.context-path=/
server.error.include-stacktrace=never
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}
server.error.whitelabel.enabled=true

# MySQL connection. Override all DB_* values in deployment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/empowerher_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.resolve-lazily=false
file.upload-dir=${FILE_UPLOAD_DIR:uploads/}

spring.web.resources.static-locations=classpath:/static/,classpath:/uploads/,file:./uploads/
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=3600
spring.mvc.static-path-pattern=/**

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.check-template-location=true

spring.security.filter.order=10
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.devtools.restart.enabled=${DEVTOOLS_RESTART_ENABLED:false}
spring.devtools.livereload.enabled=${DEVTOOLS_LIVERELOAD_ENABLED:false}
spring.devtools.restart.exclude=static/**,uploads/**

spring.mvc.throw-exception-if-no-handler-found=true
spring.mvc.format.date=iso

logging.level.com.empowerher=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.hibernate.SQL=WARN
logging.file.name=${LOG_FILE:logs/empowerher.log}
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.main.allow-circular-references=${ALLOW_CIRCULAR_REFERENCES:false}

app.email.from=${MAIL_FROM:empowerher.noreply@gmail.com}
app.email.admin=${MAIL_ADMIN:admin@empowerher.com}
app.email.support=${MAIL_SUPPORT:support@empowerher.com}
app.public-url=${APP_PUBLIC_URL:http://localhost:8081}
app.bootstrap.create-default-users=${BOOTSTRAP_CREATE_DEFAULT_USERS:false}
app.bootstrap.admin-username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.user-username=${BOOTSTRAP_USER_USERNAME:}
app.bootstrap.user-password=${BOOTSTRAP_USER_PASSWORD:}

app.email.templates.welcome=emails/welcome-email
app.email.templates.new-scheme=emails/new-scheme-notification
